<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Horses | SaddleSoul</title>
    <link rel="icon" type="image/png" href="./images/saddlesoul-logo.png">
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html" class="logo-link">
                <img src="./images/favicon.ico" class="logo-img">
                <span>SaddleSoul</span>
            </a>
        </div>

        <div class="nav-right" id="navRight">
            <span id="accountBtn" style="color:#c89b3c; cursor:pointer;">👋 Hi Guest</span>
        </div>
    </nav>

    <section class="guide-hero">
        <div class="guide-overlay">
            <h1>Buy Horses</h1>
            <p>Browse available horse listings from trusted sellers.</p>
        </div>
    </section>

    <section class="guide-container">

        <div class="buy-section">
            <h2>🛒 Available Horses</h2>

            <div id="buyListings" class="listings">
                <h3>Horse Listings</h3>
                <!-- Listings will be displayed here -->
            </div>
        </div>

        <a href="index.html" class="back-btn">← Back to Home</a>
    </section>

    <footer>
        SaddleSoul © 2026 | Buy Horses
    </footer>

    <script type="module" src="./firebase.js"></script>
    <script src="./index.js"></script>

       <script type="module">
        import { getListings } from "./supabase.js";

        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function displayBuyListings() {
            const listingsDiv = document.getElementById('buyListings');
            listingsDiv.innerHTML = '<h3>Horse Listings</h3><p>Loading...</p>';

            let listings;
            try {
                listings = await getListings();
            } catch (error) {
                console.error(error);
                listingsDiv.innerHTML = '<h3>Horse Listings</h3><p>Could not load listings. Please try again later.</p>';
                return;
            }

            listingsDiv.innerHTML = '<h3>Horse Listings</h3>';

            if (listings.length === 0) {
                listingsDiv.innerHTML += '<p>No horses available for sale.</p>';
                return;
            }

            listings.forEach(listing => {
                const item = document.createElement('div');
                item.className = 'listing-item';
                item.innerHTML = `
                    <h4>${escapeHtml(listing.name)}</h4>
                    <p><strong>Breed:</strong> ${escapeHtml(listing.breed)}</p>
                    <p><strong>Age:</strong> ${escapeHtml(listing.age)} years</p>
                    <p><strong>Height:</strong> ${escapeHtml(listing.height)} hands</p>
                    <p><strong>Weight:</strong> ${escapeHtml(listing.weight)} kg</p>
                    <p><strong>Sire:</strong> ${escapeHtml(listing.sire) || 'N/A'}</p>
                    <p><strong>Dam:</strong> ${escapeHtml(listing.dam) || 'N/A'}</p>
                    <div class="listing-photos">
                        ${listing.photos.map(photo => `<img src="${escapeHtml(photo)}" alt="Horse photo">`).join('')}
                    </div>
                `;
                listingsDiv.appendChild(item);
            });
        }

        displayBuyListings();
    </script>
